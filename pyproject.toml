[project]
name = "lewm-jax"
version = "0.1.0"
description = "LeWorldModel in JAX - Clean, minimal implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.25",
    "jaxlib>=0.4.25",
    "flax>=0.8.0",
    "optax>=0.2.0",
    "orbax-checkpoint>=0.5.0",
    "chex>=0.1.80",
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "wandb>=0.16.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.7.0",
]

[tool.uv.sources]
jax = { marker = "sys_platform != 'win32'" }
jaxlib = { marker = "sys_platform != 'win32'" }

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lewm_jax*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]