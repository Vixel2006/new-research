[project]
name = "lewm-jax"
version = "0.1.0"
description = "LeWorldModel in JAX - Clean, minimal implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lewm*", "env*", "loss*", "models*", "planner*", "train*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
