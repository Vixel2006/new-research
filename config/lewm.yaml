# LeWM (goal-conditioned JEPA) on PushT.
#
# Sizing policy for THIS box: NVIDIA GeForce RTX 2050, sm_86 (Ampere),
# 3.73 GB usable VRAM -- and it is a laptop, so the goal is "good enough and
# cool", not "fill the card". Every number below was measured on this machine
# (fwd + bwd + AdamW under bf16 autocast, peak via nvidia-smi):
#
#   img_size patch  batch   VRAM used    free
#   224      14     32      3675 MiB    0.14 G   <- upstream shape: OOMs here
#   224      14     16      2115 MiB    1.67 G
#   128      16     32      1323 MiB    2.44 G
#    64      16     64       851 MiB    2.90 G   <- THIS FILE (78% free)
#    64      16    128      1421 MiB    2.34 G
#    64       8    128      3623 MiB    0.19 G
#
# Chosen point is the 851 MiB row: ~23% of the card, leaving ~2.9 GB free for
# Lightning, the dataloader, allocator fragmentation and a second process. The
# dominant cost upstream was resolution, not batch size (257 tokens/frame vs
# 17), which is why img_size/patch_size are the knobs that matter here.
#
# Scale up later with plain CLI overrides, no file edits needed:
#   img_size=128 patch_size=16 loader.batch_size=32   # 1323 MiB, still easy
#   img_size=224 patch_size=14 loader.batch_size=16   # 2115 MiB, near the edge
defaults:
  - _self_
  - launcher: local
  - data: pusht

output_model_name: lewm
subdir: ${hydra:job.id}

# 2 dataloader workers: enough to hide lance decode latency without turning a
# laptop into a swap machine.
num_workers: 2
train_split: 0.9
seed: 3072

# 64x64 with 16x16 patches -> a 4x4 = 16-patch grid (+1 cls = 17 tokens).
# This matches the 64x64 frames the previous JAX implementation used, so
# behaviour carries over. sm_86 has native bf16; the HF ViT interpolates its
# position encoding, so img_size is free to raise without reshaping weights.
img_size: 64
patch_size: 16
encoder_scale: tiny
embed_dim: 192
encoder_resnet9: False
train_value_function: False
projector_loss_weight: 1e-3
dump_object: True

trainer:
  max_epochs: 100
  devices: 1
  accelerator: gpu
  # Native bf16 on sm_86 -> real memory saving, not emulation.
  precision: bf16
  gradient_clip_val: 1.0
  # 64 x 2 = effective batch 128, matching upstream's intent. Costs no extra
  # memory (activations are not retained), only optimizer steps.
  accumulate_grad_batches: 2
  log_every_n_steps: 20

loader:
  # Measured 851 MiB peak at this setting -- see the table above.
  batch_size: 64
  num_workers: ${num_workers}
  drop_last: True
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True
  shuffle: True

optimizer:
  type: AdamW
  lr: 1e-4
  weight_decay: 1e-3

wm:
  # 3 context frames + 1 predicted step -> 4-frame window (see data/pusht.yaml).
  history_size: 3
  num_preds: 1

model:
  _target_: stable_worldmodel.wm.lewm.LeWM
  encoder:
    _target_: stable_pretraining.backbone.utils.vit_hf
    size: ${encoder_scale}
    patch_size: ${patch_size}
    image_size: ${img_size}
    pretrained: false
    use_mask_token: false
  predictor:
    _target_: stable_worldmodel.wm.lewm.module.Predictor
    num_frames: ${wm.history_size}
    input_dim: ${embed_dim}
    hidden_dim: ${embed_dim}
    output_dim: ${embed_dim}
    # Cut from upstream 6/16/2048. The predictor runs autoregressively at plan
    # time, so its depth is paid again per CEM step -- worth keeping small.
    depth: 4
    heads: 8
    mlp_dim: 1024
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
  action_encoder:
    _target_: stable_worldmodel.wm.lewm.module.Embedder
    # Filled in by the training script from
    # frameskip * dataset.get_dim('action') = 5 * 2 = 10. Do not hardcode.
    input_dim: ???
    emb_dim: ${embed_dim}
  projector:
    _target_: stable_worldmodel.wm.lewm.module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
  pred_proj:
    _target_: stable_worldmodel.wm.lewm.module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      # The projection tensor is (N, num_proj, knots) with N = batch*num_steps,
      # so 1024 -> 512 is a direct activation saving at no accuracy cost worth
      # worrying about on a 4-frame window.
      num_proj: 512
